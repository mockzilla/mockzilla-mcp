name: publish

on:
  release:
    types: [published]

env:
  AWS_REGION: eu-central-1

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC twice over: npm Trusted Publishing, and the AWS role that reads the docs bundle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing landed in npm 11.5.1; setup-node ships an
      # older npm. Use corepack rather than `npm install -g npm@latest`
      # because the latter occasionally leaves npm in a half-installed
      # state where transitive deps go missing (e.g. promise-retry).
      - run: |
          corepack enable
          corepack prepare npm@latest --activate
          npm --version

      - name: Verify release tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag $GITHUB_REF_NAME (=$tag) != package.json version $pkg" >&2
            exit 1
          fi

      # `make publish` can still ship a version by hand before the release exists.
      - name: Check npm for this version
        id: npm
        run: |
          pkg="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$pkg" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$pkg is already on npm, skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # The product docs bundle lives only in S3: nothing serves it, and the
      # CDN in front of that bucket caches for a day, so the release reads the
      # key directly like every other consumer. github-mcp-release is a role
      # that can do this and nothing else (infra live/aws/iam-github-oidc).
      - name: Assume the docs-bundle role
        if: steps.npm.outputs.published == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build docs and hosted tools
        if: steps.npm.outputs.published == 'false'
        run: make build DOCS_BUNDLE_CMD="aws s3 cp s3://mz-prod-docs-assets/export/mcp.json -"

      # The CLI-backed smokes skip on a runner with no mockzilla; the rest run.
      - name: Smoke
        if: steps.npm.outputs.published == 'false'
        run: make smoke

      - if: steps.npm.outputs.published == 'false'
        run: npm publish --provenance --access public
