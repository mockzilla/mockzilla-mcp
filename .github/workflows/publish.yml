name: publish

on:
  release:
    types: [published]

env:
  AWS_REGION: eu-central-1

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC twice over: npm Trusted Publishing, and the AWS role that reads the docs bundle
    steps:
      - uses: actions/checkout@v4
      # No registry-url on purpose. It writes an .npmrc with
      # _authToken=XXXXX-XXXXX-XXXXX-XXXXX, setup-node's dummy when no
      # NODE_AUTH_TOKEN is set, and npm then publishes with that instead of
      # OIDC. The registry answers a bad credential with 404, not 403.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted Publishing landed in npm 11.5.1 and setup-node ships 10.x.
      # `corepack prepare --activate` printed success and left 10.9.8 in place,
      # so install it outright, and fail here rather than in a publish whose
      # 404 says nothing about the cause.
      - name: Get an npm that can publish over OIDC
        run: |
          v="$(npm --version)"
          if [ "$(printf '%s\n11.5.1\n' "$v" | sort -V | head -1)" != "11.5.1" ]; then
            npm install -g npm@latest
            v="$(npm --version)"
          fi
          echo "npm $v"
          [ "$(printf '%s\n11.5.1\n' "$v" | sort -V | head -1)" = "11.5.1" ] || {
            echo "npm $v predates Trusted Publishing" >&2; exit 1; }

      - name: Verify release tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag $GITHUB_REF_NAME (=$tag) != package.json version $pkg" >&2
            exit 1
          fi

      # `make publish` can still ship a version by hand before the release exists.
      - name: Check npm for this version
        id: npm
        run: |
          pkg="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$pkg" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$pkg is already on npm, skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # The product docs bundle lives only in S3: nothing serves it, and the
      # CDN in front of that bucket caches for a day, so the release reads the
      # key directly like every other consumer. github-mcp-release is a role
      # that can do this and nothing else (infra live/aws/iam-github-oidc).
      - name: Assume the docs-bundle role
        if: steps.npm.outputs.published == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build docs and hosted tools
        if: steps.npm.outputs.published == 'false'
        run: make build DOCS_BUNDLE_CMD="aws s3 cp s3://mz-prod-docs-assets/export/mcp.json -"

      # The CLI-backed smokes skip on a runner with no mockzilla; the rest run.
      - name: Smoke
        if: steps.npm.outputs.published == 'false'
        run: make smoke

      - if: steps.npm.outputs.published == 'false'
        run: npm publish --provenance --access public
